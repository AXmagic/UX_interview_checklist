<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Interview Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky-deep:   #c8dff5;
  --sky-mid:    #ddeeff;
  --sky-light:  #eef6ff;
  --sky-pale:   #f5f9ff;
  --cloud:      rgba(255,255,255,0.82);
  --cloud-solid:#ffffff;
  --mist:       rgba(190,215,245,0.35);
  --ink:        #1e2d3d;
  --ink-soft:   #4a6278;
  --ink-faint:  #8ba8c0;
  --accent-1:   #e05a3a; /* warm red */
  --accent-2:   #c49a1a; /* amber */
  --accent-3:   #d44a6a; /* coral-pink */
  --accent-4:   #1d8c72; /* teal */
  --accent-5:   #7c52b8; /* purple */
  --accent-6:   #c49a1a; /* amber again for phase 6 */
  --shadow-sm:  0 2px 12px rgba(100,150,200,0.12);
  --shadow-md:  0 6px 32px rgba(100,150,200,0.18);
  --shadow-lg:  0 16px 64px rgba(100,150,200,0.22);
  --radius:     14px;
  --radius-sm:  8px;
  --radius-xs:  5px;
  --blur:       blur(16px);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(160deg, #dbeeff 0%, #eaf3ff 35%, #f0f7ff 65%, #e6f0fa 100%);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* floating cloud blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.55) 0%, transparent 70%);
  top: -100px; left: -100px;
}
body::after {
  width: 500px; height: 350px;
  background: radial-gradient(ellipse, rgba(200,225,255,0.4) 0%, transparent 70%);
  bottom: -80px; right: -80px;
}

/* ── TOP BAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(220,238,255,0.75);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid rgba(255,255,255,0.7);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 20px rgba(100,160,220,0.1);
}
.topbar-brand {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.topbar-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #5ba4e0, #3d7ec4);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  box-shadow: 0 2px 8px rgba(60,126,196,0.35);
}
.topbar-title {
  font-family: 'Lora', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.topbar-fields {
  display: flex; gap: 10px; flex: 1;
}
.topbar-input {
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(180,215,255,0.6);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
  flex: 1;
  min-width: 0;
}
.topbar-input:focus {
  border-color: rgba(100,170,240,0.8);
  box-shadow: 0 0 0 3px rgba(100,170,240,0.12);
  background: rgba(255,255,255,0.9);
}
.topbar-input::placeholder { color: var(--ink-faint); }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-ghost {
  background: rgba(255,255,255,0.5);
  border-color: rgba(160,200,240,0.5);
  color: var(--ink-soft);
}
.btn-ghost:hover {
  background: rgba(255,255,255,0.85);
  border-color: rgba(100,170,240,0.6);
  color: var(--ink);
}
.btn-primary {
  background: linear-gradient(135deg, #5ba4e0, #3d7ec4);
  color: white;
  box-shadow: 0 2px 8px rgba(60,126,196,0.3);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(60,126,196,0.4);
}

/* ── LAYOUT ── */
.layout {
  display: flex;
  padding-top: 56px;
  min-height: 100vh;
  position: relative; z-index: 1;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  position: fixed;
  top: 56px; left: 0; bottom: 0;
  overflow-y: auto;
  padding: 20px 12px;
  background: rgba(225,240,255,0.55);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-right: 1px solid rgba(255,255,255,0.65);
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(150,195,240,0.4); border-radius: 2px; }

.sidebar-progress {
  margin-bottom: 20px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.6);
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: var(--shadow-sm);
}
.sidebar-progress-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.global-bar {
  height: 6px;
  background: rgba(180,215,250,0.4);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 6px;
}
.global-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #5ba4e0, #3dc4a0);
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}
.global-count {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 600;
}

.phase-nav { display: flex; flex-direction: column; gap: 4px; }
.phase-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  text-decoration: none;
}
.phase-nav-item:hover {
  background: rgba(255,255,255,0.65);
  border-color: rgba(255,255,255,0.8);
}
.phase-nav-item.active {
  background: rgba(255,255,255,0.85);
  border-color: rgba(200,230,255,0.8);
  box-shadow: var(--shadow-sm);
}
.phase-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: transform 0.2s;
}
.phase-nav-item.active .phase-dot { transform: scale(1.25); }
.phase-nav-info { flex: 1; min-width: 0; }
.phase-nav-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
}
.phase-nav-prog {
  font-size: 10px;
  color: var(--ink-faint);
  font-weight: 500;
}
.phase-mini-bar {
  height: 3px;
  background: rgba(180,215,250,0.4);
  border-radius: 2px;
  margin-top: 3px;
  overflow: hidden;
}
.phase-mini-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}

/* ── MAIN ── */
.main {
  flex: 1;
  margin-left: 220px;
  padding: 28px 32px 80px;
  max-width: 820px;
}

/* ── SECTION CARD ── */
.section-card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,0.85);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  margin-bottom: 24px;
  overflow: hidden;
  transition: box-shadow 0.3s;
}
.section-card:hover { box-shadow: var(--shadow-lg); }
.section-card.in-view {
  box-shadow: var(--shadow-lg);
  border-color: rgba(255,255,255,1);
}

.section-top {
  padding: 22px 24px 0;
  border-left: 4px solid var(--phase-color, #5ba4e0);
}
.section-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.section-num {
  font-family: 'Nunito', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-faint);
}
.section-title {
  font-family: 'Lora', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--ink);
  flex: 1;
}
.section-badge {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(200,230,255,0.5);
  color: var(--ink-soft);
  border: 1px solid rgba(180,215,255,0.5);
  white-space: nowrap;
}
.section-goal {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 16px;
  font-style: italic;
}

/* ── TIP BANNER ── */
.tip-banner {
  margin: 0 24px 16px;
  padding: 10px 14px;
  background: rgba(255,230,140,0.25);
  border: 1px solid rgba(200,160,30,0.25);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: #7a5c10;
  display: flex; gap: 8px; align-items: flex-start;
}
.tip-icon { flex-shrink: 0; font-size: 13px; }

/* ── SCRIPT BLOCK ── */
.script-block {
  margin: 0 24px 16px;
  background: linear-gradient(135deg, #1a2a3a 0%, #243548 100%);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  position: relative;
  box-shadow: 0 4px 20px rgba(20,40,70,0.2);
}
.script-label {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(140,180,220,0.8);
  margin-bottom: 8px;
}
.script-text {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 13px;
  line-height: 1.7;
  color: #d4e8f8;
}
.copy-btn {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--radius-xs);
  padding: 4px 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 10px; font-weight: 600;
  color: rgba(200,225,250,0.8);
  cursor: pointer;
  transition: all 0.2s;
}
.copy-btn:hover { background: rgba(255,255,255,0.18); color: white; }
.copy-btn.copied { color: #6ee8c0; border-color: rgba(110,232,192,0.5); }

/* ── QUESTIONS ── */
.questions { padding: 0 24px; }
.q-item {
  padding: 11px 0;
  border-bottom: 1px solid rgba(180,215,250,0.25);
  display: flex;
  flex-direction: column;
  gap: 0;
}
.q-item:last-child { border-bottom: none; }
.q-row {
  display: flex; align-items: flex-start; gap: 10px;
}
.q-check {
  width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
  appearance: none; -webkit-appearance: none;
  border: 1.5px solid rgba(150,195,240,0.6);
  border-radius: 6px;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.q-check:checked {
  background: linear-gradient(135deg, #4fb87a, #3aa060);
  border-color: #4fb87a;
}
.q-check:checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 3px;
  width: 7px; height: 5px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg);
}
.q-check:hover:not(:checked) {
  border-color: rgba(100,170,240,0.8);
  background: rgba(255,255,255,0.8);
}
.q-label {
  flex: 1;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.55;
  cursor: pointer;
  transition: color 0.2s;
}
.q-label.done {
  text-decoration: line-through;
  color: var(--ink-faint);
}
.q-right {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.q-tag {
  font-size: 10px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(200,228,255,0.4);
  color: var(--ink-soft);
  border: 1px solid rgba(180,215,255,0.4);
  white-space: nowrap;
}
.note-toggle {
  font-size: 10px; font-weight: 700;
  color: var(--ink-faint);
  background: none; border: none;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  transition: all 0.15s;
  white-space: nowrap;
}
.note-toggle:hover {
  background: rgba(200,228,255,0.4);
  color: var(--ink-soft);
}
.q-note-wrap {
  display: none;
  margin-top: 6px;
  margin-left: 30px;
}
.q-note-wrap.open { display: block; }
.q-note {
  width: 100%;
  min-height: 52px;
  background: rgba(240,248,255,0.7);
  border: 1px solid rgba(180,215,255,0.5);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border 0.2s;
  line-height: 1.55;
}
.q-note:focus { border-color: rgba(100,170,240,0.7); background: rgba(255,255,255,0.85); }
.q-note::placeholder { color: var(--ink-faint); }

/* ── SECTION NOTES ── */
.section-notes {
  padding: 16px 24px 20px;
  border-top: 1px solid rgba(180,215,250,0.3);
  margin-top: 4px;
}
.section-notes-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.section-notes textarea {
  width: 100%;
  min-height: 72px;
  background: rgba(240,248,255,0.6);
  border: 1px solid rgba(180,215,255,0.4);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  line-height: 1.6;
  transition: border 0.2s, background 0.2s;
}
.section-notes textarea:focus {
  border-color: rgba(100,170,240,0.65);
  background: rgba(255,255,255,0.85);
}
.section-notes textarea::placeholder { color: var(--ink-faint); }

/* ── GLOBAL INSIGHTS ── */
.global-insights {
  background: rgba(255,255,255,0.72);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,0.85);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 22px 24px;
  margin-top: 8px;
}
.global-insights-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.insights-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #5ba4e0, #3d7ec4);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  color: white;
  box-shadow: 0 2px 8px rgba(60,126,196,0.3);
}
.insights-title {
  font-family: 'Lora', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
}
.global-insights textarea {
  width: 100%;
  min-height: 110px;
  background: rgba(240,248,255,0.6);
  border: 1px solid rgba(180,215,255,0.4);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  line-height: 1.65;
  transition: border 0.2s, background 0.2s;
}
.global-insights textarea:focus {
  border-color: rgba(100,170,240,0.65);
  background: rgba(255,255,255,0.9);
}
.global-insights textarea::placeholder { color: var(--ink-faint); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(20,40,80,0.35);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  display: none;
}
.modal-overlay.open { display: flex; }
.modal {
  background: rgba(245,250,255,0.95);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: var(--radius);
  box-shadow: 0 24px 80px rgba(50,100,180,0.25);
  padding: 28px 28px 24px;
  max-width: 380px;
  width: 90%;
  text-align: center;
  animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { transform: scale(0.92) translateY(8px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.modal h3 {
  font-family: 'Lora', serif;
  font-size: 1.15rem;
  color: var(--ink);
  margin-bottom: 8px;
}
.modal p {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 20px;
  line-height: 1.6;
}
.modal-btns { display: flex; gap: 10px; justify-content: center; }
.btn-danger {
  background: linear-gradient(135deg, #e05a3a, #c44225);
  color: white;
  box-shadow: 0 2px 8px rgba(200,70,40,0.3);
}
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(200,70,40,0.4); }

/* ── MOBILE ── */
@media (max-width: 680px) {
  .sidebar {
    position: static; width: 100%;
    flex-direction: row; height: auto;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,0.65);
    padding: 10px 12px;
    overflow-x: auto; overflow-y: visible;
  }
  .sidebar-progress { display: none; }
  .phase-nav { flex-direction: row; gap: 6px; white-space: nowrap; }
  .phase-nav-info .phase-nav-prog,
  .phase-mini-bar { display: none; }
  .phase-nav-item { padding: 6px 10px; }
  .layout { flex-direction: column; }
  .main { margin-left: 0; padding: 16px 16px 60px; }
  .topbar-fields { display: none; }
}

/* ── ANIMATIONS ── */
.section-card {
  animation: cardFloat 0.5s cubic-bezier(0.4,0,0.2,1) both;
}
@keyframes cardFloat {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.section-card:nth-child(1) { animation-delay: 0.05s; }
.section-card:nth-child(2) { animation-delay: 0.10s; }
.section-card:nth-child(3) { animation-delay: 0.15s; }
.section-card:nth-child(4) { animation-delay: 0.20s; }
.section-card:nth-child(5) { animation-delay: 0.25s; }
.section-card:nth-child(6) { animation-delay: 0.30s; }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-icon">🎙</div>
    <span class="topbar-title">Interview Guide</span>
  </div>
  <div class="topbar-fields">
    <input type="text" class="topbar-input" id="participantId" placeholder="Participant name / ID (np. P-04 / Anna K.)">
    <input type="text" class="topbar-input" id="sessionDate" placeholder="Date & time">
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" onclick="openModal()">↺ Reset</button>
    <button class="btn btn-primary" onclick="exportNotes()">↓ Export</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-progress">
      <div class="sidebar-progress-label">Overall progress</div>
      <div class="global-bar"><div class="global-bar-fill" id="globalFill"></div></div>
      <div class="global-count" id="globalCount">0 / 18 questions</div>
    </div>
    <div class="phase-nav" id="phaseNav">
      <!-- injected by JS -->
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="mainContent">
    <!-- injected by JS -->
    <div class="global-insights">
      <div class="global-insights-header">
        <div class="insights-icon">✦</div>
        <h2 class="insights-title">Key Insights</h2>
      </div>
      <textarea id="globalInsights" placeholder="Key themes, surprising moments, hypotheses to explore..."></textarea>
    </div>
  </main>

</div>

<!-- RESET MODAL -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Reset session?</h3>
    <p>This will clear all checkboxes and notes. The action cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="resetSession()">Yes, reset</button>
    </div>
  </div>
</div>

<script>
const PHASES = [
  {
    id: 'phase1',
    num: '01',
    name: 'Wprowadzenie',
    badge: 'Budowanie zaufania',
    goal: 'Rozluźnienie atmosfery i formalności — zanim padnie pierwsze merytoryczne pytanie.',
    color: '#e05a3a',
    script: 'Cześć, dziękuję za Twój czas. Chcemy porozmawiać o tym, jak [problem/dziedzina], abyśmy mogli lepiej dopasować nasze rozwiązanie do realnych potrzeb. Nie ma złych odpowiedzi – interesuje mnie Twoja szczera opinia. Czy zgadzasz się na nagrywanie rozmowy wyłącznie do celów badawczych?',
    questions: [
      { text: '"Czym zajmujesz się na co dzień?"', tag: 'rozgrzewka' },
      { text: '"Jak minął Ci dzisiejszy poranek?"', tag: 'rozgrzewka' },
    ],
    notesPlaceholder: 'Atmosphere, nervousness level, initial impressions...',
  },
  {
    id: 'phase2',
    num: '02',
    name: 'Kontekst i nawyki',
    badge: 'Ogólny obraz',
    goal: 'Zrozumienie, jak użytkownik funkcjonuje w badanym obszarze na co dzień.',
    color: '#c49a1a',
    questions: [
      { text: '"Opowiedz mi, jak obecnie wygląda Twój proces [np. robienia zakupów spożywczych]?"', tag: 'otwarty' },
      { text: '"Z jakich narzędzi lub aplikacji korzystasz, gdy chcesz [cel]?"', tag: 'narzędzia' },
      { text: '"Jak często zdarza Ci się [czynność] w ciągu typowego tygodnia?"', tag: 'częstość' },
    ],
    notesPlaceholder: 'Current tools, frequency, mental models...',
  },
  {
    id: 'phase3',
    num: '03',
    name: 'Problemy i bolączki',
    badge: 'Głębokie nurkowanie',
    goal: 'Identyfikacja frustracji i potrzeb — pytaj o konkretne sytuacje, nie opinie.',
    color: '#d44a6a',
    tip: 'Stosuj metodę 5 Dlaczego — gdy rozmówca powie o problemie, zapytaj "Dlaczego to jest trudne?" co najmniej raz.',
    questions: [
      { text: '"Opowiedz mi o ostatniej sytuacji, w której [problem]. Co wtedy zrobiłeś?"', tag: 'narracja' },
      { text: '"Co jest dla Ciebie najbardziej irytujące w procesie [X]?"', tag: 'ból' },
      { text: '"Ile czasu zajmuje Ci zazwyczaj rozwiązanie tego problemu?"', tag: 'miara' },
    ],
    notesPlaceholder: 'Pain points, emotional signals, exact words used...',
  },
  {
    id: 'phase4',
    num: '04',
    name: 'Alternatywne rozwiązania',
    badge: 'Analiza konkurencji',
    goal: 'Dowiedzenie się, jak użytkownik radzi sobie bez Twojego produktu.',
    color: '#1d8c72',
    questions: [
      { text: '"Czego używałeś wcześniej, zanim zacząłeś korzystać z [obecne rozwiązanie]?"', tag: 'historia' },
      { text: '"Co sprawiło, że zdecydowałeś się na to konkretne narzędzie?"', tag: 'motywacja' },
      { text: '"Gdybyś mógł zmienić jedną rzecz w [obecne rozwiązanie], co by to było?"', tag: 'ulepszenie' },
    ],
    notesPlaceholder: 'Competitors mentioned, switching triggers, workarounds...',
  },
  {
    id: 'phase5',
    num: '05',
    name: 'Walidacja pomysłu',
    badge: 'Opcjonalnie',
    goal: 'Sprawdzenie reakcji na koncept — bez sprzedawania, wyłącznie zbieranie reakcji.',
    color: '#7c52b8',
    tip: 'Mów "wyobraź sobie narzędzie" — unikaj opisywania produktu jako gotowego, żeby uniknąć efektu kurtuazji.',
    questions: [
      { text: '"Wyobraź sobie narzędzie, które pozwala na [główna funkcja]. Jak wpłynęłoby to na Twój dzień pracy?"', tag: 'koncepcja' },
      { text: '"W jakiej sytuacji najprawdopodobniej byś po to sięgnął?"', tag: 'kontekst' },
      { text: '"Co mogłoby Cię powstrzymać przed wypróbowaniem takiego rozwiązania?"', tag: 'bariery' },
    ],
    notesPlaceholder: 'Spontaneous reactions, hesitations, use case ideas...',
  },
  {
    id: 'phase6',
    num: '06',
    name: 'Zakończenie',
    badge: 'Otwarta furtka',
    goal: 'Pozostawienie dobrego wrażenia i możliwości dalszego kontaktu.',
    color: '#c49a1a',
    closingScript: 'Dziękuję bardzo za pomoc. Twoje odpowiedzi są dla nas niezwykle cenne.',
    questions: [
      { text: '"Czy jest coś, o czym nie wspomniałem, a co wydaje Ci się ważne w tym temacie?"', tag: 'otwarcie' },
      { text: '"Czy znasz kogoś, kto zmaga się z podobnymi wyzwaniami i mógłby z nami porozmawiać?"', tag: 'referral' },
    ],
    notesPlaceholder: 'Unprompted topics raised, referrals, follow-up ideas...',
  },
];

const state = {
  checked: {},
  qNotes: {},
  sectionNotes: {},
};

function buildUI() {
  const main = document.getElementById('mainContent');
  const nav = document.getElementById('phaseNav');
  const insightsEl = document.querySelector('.global-insights');

  PHASES.forEach((phase, pi) => {
    // Sidebar nav item
    const navItem = document.createElement('a');
    navItem.className = 'phase-nav-item';
    navItem.href = '#' + phase.id;
    navItem.id = 'nav-' + phase.id;
    navItem.innerHTML = `
      <div class="phase-dot" style="background:${phase.color}"></div>
      <div class="phase-nav-info">
        <span class="phase-nav-name">${phase.name}</span>
        <span class="phase-nav-prog" id="prog-${phase.id}">0 / ${phase.questions.length}</span>
        <div class="phase-mini-bar"><div class="phase-mini-fill" id="mini-${phase.id}" style="background:${phase.color}"></div></div>
      </div>`;
    navItem.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(phase.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nav.appendChild(navItem);

    // Section card
    const card = document.createElement('div');
    card.className = 'section-card';
    card.id = phase.id;
    card.style.setProperty('--phase-color', phase.color);

    let inner = `
      <div class="section-top">
        <div class="section-header">
          <span class="section-num">${phase.num}</span>
          <h2 class="section-title">${phase.name}</h2>
          <span class="section-badge">${phase.badge}</span>
        </div>
        <p class="section-goal">${phase.goal}</p>
      </div>`;

    if (phase.script) {
      inner += `
        <div class="script-block" style="margin-top:4px;">
          <div class="script-label">Script — read verbatim</div>
          <div class="script-text">"${phase.script}"</div>
          <button class="copy-btn" onclick="copyText(this,'${escapeJs(phase.script)}')">Copy</button>
        </div>`;
    }

    if (phase.tip) {
      inner += `
        <div class="tip-banner">
          <span class="tip-icon">▲</span>
          <span>${phase.tip}</span>
        </div>`;
    }

    inner += `<div class="questions">`;
    phase.questions.forEach((q, qi) => {
      const key = `${phase.id}-q${qi}`;
      inner += `
        <div class="q-item">
          <div class="q-row">
            <input type="checkbox" class="q-check" id="${key}" onchange="onCheck('${phase.id}',${qi},this)">
            <label class="q-label" for="${key}">${q.text}</label>
            <div class="q-right">
              <span class="q-tag">${q.tag}</span>
              <button class="note-toggle" onclick="toggleNote('${key}-note')">+ Note</button>
            </div>
          </div>
          <div class="q-note-wrap" id="${key}-note">
            <textarea class="q-note" placeholder="Note for this question..." 
              oninput="state.qNotes['${key}'] = this.value"
              id="${key}-noteinput"></textarea>
          </div>
        </div>`;
    });
    inner += `</div>`;

    if (phase.closingScript) {
      inner += `
        <div class="script-block" style="margin:0 24px 16px;margin-top:8px;">
          <div class="script-label">Closing — read verbatim</div>
          <div class="script-text">"${phase.closingScript}"</div>
          <button class="copy-btn" onclick="copyText(this,'${escapeJs(phase.closingScript)}')">Copy</button>
        </div>`;
    }

    inner += `
      <div class="section-notes">
        <div class="section-notes-label">Phase notes</div>
        <textarea placeholder="${phase.notesPlaceholder}"
          oninput="state.sectionNotes['${phase.id}'] = this.value"
          id="snotes-${phase.id}"></textarea>
      </div>`;

    card.innerHTML = inner;
    main.insertBefore(card, insightsEl);
  });

  // Date
  const now = new Date();
  document.getElementById('sessionDate').value =
    now.toLocaleDateString('pl-PL') + ', ' + now.toLocaleTimeString('pl-PL', { hour:'2-digit', minute:'2-digit' });
}

function escapeJs(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '\\"');
}

function onCheck(phaseId, qi, el) {
  const key = `${phaseId}-q${qi}`;
  state.checked[key] = el.checked;
  const label = document.querySelector(`label[for="${key}"]`);
  if (label) label.classList.toggle('done', el.checked);
  updateProgress();
}

function updateProgress() {
  const total = PHASES.reduce((s, p) => s + p.questions.length, 0);
  let done = 0;
  PHASES.forEach((phase, pi) => {
    let pDone = 0;
    phase.questions.forEach((_, qi) => {
      const key = `${phase.id}-q${qi}`;
      if (state.checked[key]) { pDone++; done++; }
    });
    const pTotal = phase.questions.length;
    document.getElementById(`prog-${phase.id}`).textContent = `${pDone} / ${pTotal}`;
    document.getElementById(`mini-${phase.id}`).style.width = (pDone / pTotal * 100) + '%';
  });
  document.getElementById('globalFill').style.width = (done / total * 100) + '%';
  document.getElementById('globalCount').textContent = `${done} / ${total} questions`;
}

function toggleNote(id) {
  const wrap = document.getElementById(id);
  wrap.classList.toggle('open');
  if (wrap.classList.contains('open')) {
    wrap.querySelector('textarea').focus();
  }
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function openModal() { document.getElementById('resetModal').classList.add('open'); }
function closeModal() { document.getElementById('resetModal').classList.remove('open'); }

function resetSession() {
  state.checked = {};
  state.qNotes = {};
  state.sectionNotes = {};
  document.querySelectorAll('.q-check').forEach(c => c.checked = false);
  document.querySelectorAll('.q-label').forEach(l => l.classList.remove('done'));
  document.querySelectorAll('.q-note, .section-notes textarea, #globalInsights').forEach(t => t.value = '');
  document.querySelectorAll('.q-note-wrap').forEach(w => w.classList.remove('open'));
  document.getElementById('participantId').value = '';
  updateProgress();
  closeModal();
}

function exportNotes() {
  const pid = document.getElementById('participantId').value || 'Unknown';
  const date = document.getElementById('sessionDate').value || new Date().toLocaleDateString();
  let out = `UX INTERVIEW NOTES\nParticipant: ${pid}\nDate: ${date}\n${'='.repeat(48)}\n\n`;

  PHASES.forEach(phase => {
    out += `\n── ${phase.num} ${phase.name.toUpperCase()} ──\n\n`;
    phase.questions.forEach((q, qi) => {
      const key = `${phase.id}-q${qi}`;
      const checked = state.checked[key] ? '[✓]' : '[ ]';
      out += `${checked} ${q.text}\n`;
      const note = document.getElementById(`${key}-noteinput`)?.value;
      if (note) out += `    → ${note}\n`;
    });
    const sn = document.getElementById(`snotes-${phase.id}`)?.value;
    if (sn) out += `\nPhase notes:\n${sn}\n`;
  });

  const gi = document.getElementById('globalInsights')?.value;
  if (gi) out += `\n${'='.repeat(48)}\nKEY INSIGHTS\n${gi}\n`;

  const blob = new Blob([out], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `interview-${pid.replace(/\s+/g,'-')}-${date.replace(/[^\d]/g,'-')}.txt`;
  a.click();
}

// Intersection Observer — highlight active phase in sidebar
function initObserver() {
  const sections = document.querySelectorAll('.section-card');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const id = entry.target.id;
      const navItem = document.getElementById('nav-' + id);
      if (!navItem) return;
      if (entry.isIntersecting) {
        document.querySelectorAll('.phase-nav-item').forEach(n => n.classList.remove('active'));
        navItem.classList.add('active');
      }
    });
  }, { threshold: 0.3 });
  sections.forEach(s => observer.observe(s));
}

buildUI();
updateProgress();
setTimeout(initObserver, 300);
</script>
</body>
</html>
